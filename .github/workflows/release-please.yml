name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to >=11.5.1
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        env:
          TAG_VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --ignore-scripts

  release-alert:
    name: Alert on a failed release
    needs: [release-please, publish]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Post to the ops channel
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CREATED" = "true" ]; then
            text="Release $TAG_NAME of $REPOSITORY failed: $RUN_URL"
          else
            text="Release Please failed on $REPOSITORY before reporting a release; check for a tag without its package: $RUN_URL"
          fi
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::DISCORD_OPS_WEBHOOK_URL is not set; $text"
            exit 1
          fi
          payload=$(jq -n --arg text "$text" '{content: $text, allowed_mentions: {parse: []}}')
          curl --fail --silent --show-error --max-time 20 --output /dev/null --write-out 'Discord answered %{http_code}\n' \
            -H 'Content-Type: application/json' -H 'User-Agent: AetherOps/1.0' \
            --data "$payload" "${WEBHOOK_URL}?wait=true"
