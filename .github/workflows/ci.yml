name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate branch prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^dependabot/ ]] || [[ "$BRANCH" =~ ^release-please-- ]]; then
            echo "Skipping branch name policy for bot branch '$BRANCH'."
            exit 0
          fi
          if [[ ! "$BRANCH" =~ ^(feat|fix|chore|refactor|docs|test)/ ]]; then
            echo "::error::Branch '$BRANCH' must start with feat/, fix/, chore/, refactor/, docs/, or test/"
            exit 1
          fi
          echo "Branch '$BRANCH' is valid."

  workflow-guards:
    name: Workflow guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML
        run: pip install --user pyyaml

      - name: Workflow run interpolation tests
        run: python3 scripts/workflow-run-interpolation.test.py

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Release auto-merge gate tests
        run: node --test .github/scripts/release-auto-merge-gate.test.mjs

      - name: Behind bot tests
        run: node --test .github/scripts/behind-bot.test.mjs

  android:
    name: Android (${{ matrix.sample }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [ AetherSmoke076, AetherSmoke086 ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: samples/${{ matrix.sample }}/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install sample dependencies
        working-directory: samples/${{ matrix.sample }}
        run: npm ci

      - name: Build Android debug
        working-directory: samples/${{ matrix.sample }}/android
        run: ./gradlew assembleDebug --no-daemon

  ios:
    name: iOS (${{ matrix.sample }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        sample: [ AetherSmoke076, AetherSmoke086 ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: samples/${{ matrix.sample }}/package-lock.json

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          working-directory: samples/${{ matrix.sample }}

      - name: Install sample dependencies
        working-directory: samples/${{ matrix.sample }}
        run: npm ci

      - name: Install pods
        working-directory: samples/${{ matrix.sample }}
        env:
          BUNDLE_FROZEN: "true"
        run: |
          bundle install
          cd ios && bundle exec pod install

      - name: Build iOS simulator
        working-directory: samples/${{ matrix.sample }}/ios
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          set -o pipefail
          xcodebuild -workspace "${SAMPLE}.xcworkspace" \
            -scheme "${SAMPLE}" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions

  native-ci:
    name: Native CI
    needs:
      - branch-name
      - workflow-guards
      - android
      - ios
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the branch name policy on pull requests
        if: ${{ github.event_name == 'pull_request' && needs.branch-name.result != 'success' }}
        run: |
          echo "::error::The Branch name policy job did not succeed; see that job for the allowed prefixes."
          exit 1

      - name: Require workflow guards
        if: ${{ needs.workflow-guards.result != 'success' }}
        run: |
          echo "::error::Workflow guards did not succeed; see that job."
          exit 1

      - name: Require Android builds
        if: ${{ needs.android.result != 'success' }}
        run: |
          echo "::error::An Android build job did not succeed; see the Android matrix."
          exit 1

      - name: Require iOS builds
        if: ${{ needs.ios.result != 'success' }}
        run: |
          echo "::error::An iOS build job did not succeed; see the iOS matrix."
          exit 1
